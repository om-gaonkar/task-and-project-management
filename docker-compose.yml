# Optional development convenience. The app only needs a reachable MongoDB.
# A single-node replica set is used so multi-document transactions work in later phases.
#
#   docker compose up -d mongo
#   MONGODB_URI=mongodb://127.0.0.1:27017/productivity_workspace?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
